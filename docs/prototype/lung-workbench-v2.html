function review(){return `${head('复诊准备','从已有资料形成一页沟通提纲；你可以编辑、删减和选择要带去讨论的内容。',btn('预览沟通提纲','preview','btn primary'))}<div class="grid2"><div class="card">${section('想问医生的问题','默认只选中你确认要带去的问题。')}<div>${state.questions.map(q=>`<div class="question"><input type="checkbox" data-action="q-check" data-id="${q.id}" ${q.selected?'checked':''} aria-label="选择问题"><div><textarea data-action="q-edit" data-id="${q.id}" aria-label="编辑问题">${esc(q.text)}</textarea><small>${esc(q.source)}</small></div>${btn('×','q-delete','icon-button small',`data-id="${q.id}" aria-label="删除问题"`)}</div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:12px">${btn('＋ 添加自己的问题','add-q','btn soft')}${btn('从肺癌场景挑选问题','question-bank','btn')}</div></div><aside><div class="card">${section('本次讨论资料','可选内容以来源和状态一起展示。')}<div class="list-row"><div><b>肺穿刺和病理报告</b><p>原件索引 · 模拟</p></div><input type="checkbox" checked aria-label="选择肺穿刺和病理报告"></div><div class="list-row"><div><b>一图秀（选定指标）</b><p>CEA / CYFRA21-1 / NSE · 示意</p></div><input type="checkbox" checked aria-label="选择一图秀"></div><div class="list-row"><div><b>未核对草稿</b><p>默认不加入正式摘要</p></div><input type="checkbox" aria-label="选择未核对草稿"></div><div class="info-box warm">导出/分享功能未接入。此处只预览，不生成真实文件。</div></div></aside></div>`}
function trialRows(rows){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>登记编号 / 来源</th><th>研究标题</th><th>类型</th><th>阶段</th><th>招募状态</th><th>开始日期</th></tr></thead><tbody>${rows.map(t=>`<tr><td><a href="${t.url}" target="_blank" rel="noreferrer">${t.id}</a><br><small>ClinicalTrials.gov</small></td><td>${esc(t.title)}</td><td>${esc(t.type||'未报告')}</td><td>${esc(t.phase||'未报告')}</td><td>${esc(t.status||'未报告')}</td><td>${esc(t.start||'未报告')}</td></tr>`).join('')||'<tr><td colspan="6">没有符合条件的本地记录</td></tr>'}</tbody></table></div>`}
function trialTable(){const rows=trialData;return `<div class="grid3"><div class="stat"><span>内置快照</span><strong>14 条</strong><small>ClinicalTrials.gov · 2026-10-17</small></div><div class="stat"><span>疾病类型</span><strong>SCLC / NSCLC</strong><small>按肺癌亚型筛选</small></div><div class="stat"><span>在线通道</span><strong>待配置</strong><small>Veeva / WHO ICTRP / ChiCTR</small></div></div><div class="section-title"><div><h2>多通道检索</h2><p>本地数据库可立即筛选；在线来源展示接入位，当前不会伪装成实时结果。</p></div></div><div class="metric-selects"><label class="check-pill"><input type="checkbox" checked disabled>内置数据库 · ClinicalTrials.gov快照（14）</label><label class="check-pill"><input type="checkbox" disabled>Veeva · 待配置</label><label class="check-pill"><input type="checkbox" disabled>WHO ICTRP · 待配置</label><label class="check-pill"><input type="checkbox" disabled>ChiCTR · 待配置</label><label class="check-pill"><input type="checkbox" disabled>中国药物临床试验登记 · 待配置</label></div><form id="trial-search-form" class="form-grid"><div class="field"><label for="trial-histology">病理类型</label><select id="trial-histology"><option value="">全部</option><option>NSCLC</option><option>SCLC</option></select></div><div class="field"><label for="trial-phase">研究阶段</label><select id="trial-phase"><option value="">全部阶段</option>${[...new Set(rows.map(x=>x.phase).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field full"><label for="trial-query">关键词 / 靶点 / 药物</label><input id="trial-query" placeholder="例如 EGFR、KRAS、DLL3、放疗、药物名称"></div><div class="field"><label for="trial-status">招募状态</label><select id="trial-status"><option value="">全部状态</option>${[...new Set(rows.map(x=>x.status).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label for="trial-region">研究地区</label><select id="trial-region"><option value="">全部地区（当前快照未结构化地区字段）</option><option disabled>中国 · 待补充字段</option><option disabled>美国 · 待补充字段</option></select></div><div class="field full" style="display:flex;gap:8px;align-items:center">${btn('搜索内置数据库','trial-search','btn primary')}<span class="small muted">结果只来自此处标明的快照</span></div></form><div id="trial-results" style="margin-top:14px">${trialRows(rows)}</div><p class="small muted">数据快照：2026-10-17；14条公开研究登记。招募状态和研究信息可能变化，请点登记编号核对官方页面。此页面不评估个人入组资格。</p>`}
function trials(){return `${head('来源与试验','试验登记用于讨论线索。不同登记平台覆盖范围不同，联系研究中心前需核对最新状态。') }<div class="grid2"><div class="card">${section('肺癌临床试验样本','SCLC / NSCLC；本地快照不是全量检索。')}${trialTable()}<div class="info-box">数据库路径：reference/trials/lung-cancer-trials-2026.sqlite。样本 14 条，覆盖时间与来源范围请看随附说明。</div></div><aside><div class="card">${section('如何理解登记信息','登记不代表疗效已经证实，也不表示个人符合入组。')}<div class="priority"><span class="num">1</span><div><b>看研究对象和治疗阶段</b><p>病理类型、分期、既往治疗、分子条件可能不同。</p></div></div><div class="priority"><span class="num">2</span><div><b>确认地区和招募地点</b><p>全球研究不代表中国有研究中心。</p></div></div><div class="priority"><span class="num">3</span><div><b>由研究中心确认资格</b><p>工作台不计算个人符合概率。</p></div></div><div class="info-box warm">该页用于产品设计演示，尚未连接数据库查询和实时同步。</div></div></aside></div>`}
function render(){const page=PAGES.find(p=>p[0]===state.page)||PAGES[0];$('#nav').innerHTML=PAGES.map(([id,label,ic])=>`<button class="nav-button" data-action="go" data-page="${id}" ${id===state.page?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${ic}</span><span>${label}</span>${id==='review'?'<span class="nav-count">3</span>':''}</button>`).join('');$('#breadcrumb').textContent=page[1];$('#avatar').textContent=current().name.slice(0,1);$('#profile-name').textContent=current().name+'的资料';$('#profile-meta').textContent=current().meta+' · 模拟';const views={dashboard,timeline:timelinePage,records,clinical,care,review,trials};$('#main').innerHTML=`<div class="page-enter">${views[state.page]()}</div>`;}
function modal(title,body,foot){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog-foot').innerHTML=foot;$('#dialog').showModal()}
function close(){if($('#dialog').open)$('#dialog').close()}
function recordModal(){modal('记录一件事',`<form id="record-form"><div class="form-grid"><div class="field"><label for="record-type">记录类型</label><select id="record-type" name="type"><option>穿刺 / 标本流转</option><option>病理或分子检测</option><option>治疗 / 用药</option><option>影像检查</option><option>放疗进度</option><option>胸水操作</option><option>症状 / 日常活动</option></select></div><div class="field"><label for="record-date">发生日期</label><input id="record-date" name="date" type="date" value="2026-10-17"></div><div class="field full"><label for="record-note">记下你知道的内容</label><textarea id="record-note" name="note" placeholder="可以只写一句话；计划、实际、患者自述或团队确认请尽量注明"></textarea><span class="field-help">仅在当前页面内存中演示，刷新后会清除。</span></div></div></form>`,`${btn('取消','close','btn')}<button type="submit" form="record-form" class="btn primary">保存模拟记录</button>`)}
function preview(){const qs=state.questions.filter(q=>q.selected);modal('复诊沟通提纲预览',`<div class="notice">原型预览 · 未生成文件，不含真实病历。</div><h3 style="margin-top:14px">本次想讨论的问题（${qs.length}）</h3><ol>${qs.map(q=>`<li style="margin:8px 0">${esc(q.text)} <small class="muted">(${esc(q.source)})</small></li>`).join('')||'<li>尚未选择问题</li>'}</ol><h3>资料目录（模拟）</h3><p class="small">穿刺/病理、分子检测、影像与近期检验条目。原件来源和未核对状态需在正式产品中保留。</p>`,btn('返回编辑','close','btn primary'))}
function handleAction(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='go')navigate(el.dataset.page,el.dataset.sub);else if(a==='sub'){state.sub[state.page]=el.dataset.sub;render()}else if(a==='range'){state.range=el.dataset.range;render()}else if(a==='metric'){const k=el.dataset.metric;state.metrics=el.checked?[...new Set([...state.metrics,k])]:state.metrics.filter(x=>x!==k);render()}else if(a==='event-filter'){state.events[el.dataset.event]=el.checked;render()}else if(a==='flip'){el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')!=='true')}else if(a==='record')recordModal();else if(a==='close')close();else if(a==='profiles'){const options=profiles.map(p=>`<button class="list-row" style="width:100%;text-align:left;border:0;background:white" data-action="choose-profile" data-profile="${p.id}"><span><b>${esc(p.name)} · ${esc(p.meta)}</b><p class="muted small">${esc(p.stage)} · 模拟资料</p></span>↗</button>`).join('');modal('切换模拟患者',`<p class="small muted">场景切换只用于查看不同肺癌路径，不代表真实患者记录。</p>${options}`,btn('取消','close','btn'))}else if(a==='choose-profile'){state.profile=el.dataset.profile;close();render();toast('已切换至模拟档案')}else if(a==='point'){modal(`${el.dataset.name} · 记录详情`,`<div class="mini-stats"><div class="stat"><span>记录日期</span><strong>${el.dataset.date}</strong></div><div class="stat"><span>结果</span><strong>${el.dataset.value}</strong><small>${el.dataset.unit}</small></div></div><div class="info-box">来源：${esc(el.dataset.source)}（模拟）。真实产品应可打开对应报告原件。</div>`,btn('关闭','close','btn primary'))}else if(a==='source'){modal('来源材料 · 模拟',`<div class="notice">以下只说明来源回链交互，不是实际检查报告。</div><h3 style="margin-top:14px">${esc(el.dataset.source||'模拟原件')}</h3><p class="small muted">采集日期、报告日期、标本编号和文件页码在真实资料中应分别保留。当前页面不读取任何文件。</p>`,btn('关闭','close','btn primary'))}else if(a==='add-q'){const q=el.dataset.question||'';state.questions.push({id:Date.now(),text:q,source:'来自肺癌问题模板 · 模拟',selected:true});close();navigate('review');toast('已加入复诊问题')}else if(a==='question-bank'){const qs=['这份报告中哪些信息还没确认？','穿刺样本是否足以完成病理、分子和 PD-L1 检测？','靶向治疗的适用条件、复查安排和副作用联系路径分别是什么？','影像中哪些部位需要进一步确认或比较？','如果我考虑临床试验，应该联系哪个研究中心确认条件？'];modal('从肺癌场景挑选问题',qs.map(q=>`<button class="list-row" style="width:100%;text-align:left;border:0;background:white" data-action="add-q" data-question="${esc(q)}">${esc(q)}　＋</button>`).join(''),btn('完成','close','btn'))}else if(a==='q-delete'){state.questions=state.questions.filter(q=>String(q.id)!==el.dataset.id);render()}else if(a==='preview')preview();else if(a==='settings'){modal('工作台配置',`<div class="form-grid"><div class="field full"><label>临床试验数据通道</label><div class="check-pill">✓ 内置数据库：ClinicalTrials.gov 快照（14 条）</div><div class="check-pill">Veeva / WHO ICTRP / ChiCTR：中国药物临床试验登记 — 待配置连接器</div><span class="field-help">正式版本需明确各通道授权、更新频率、去重规则和来源字段。</span></div><div class="field full"><label>本地资料目录</label><input value="演示状态 · 未连接" disabled></div><div class="field full"><label>患者信息保护</label><span>当前为静态演示，不读取目录、不保存真实患者资料。</span></div><div class="field full"><label>界面显示</label><span>主题和大字模式可从顶栏切换；原型刷新后重置。</span></div></div>`,btn('完成','close','btn primary'))}else if(a==='trial-search'){e.preventDefault();const q=$('#trial-query').value.trim().toLowerCase(),hist=$('#trial-histology').value,phase=$('#trial-phase').value,status=$('#trial-status').value;const found=trialData.filter(t=>(!hist||t.type===hist)&&(!phase||t.phase===phase)&&(!status||t.status===status)&&(!q||[t.id,t.title,t.type,t.phase,t.status,t.sponsor].join(' ').toLowerCase().includes(q)));$('#trial-results').innerHTML=trialRows(found);toast(`内置数据库：找到 ${found.length} 条`)}else if(a==='about'){modal('关于小肺宝原型 v2',`<p>按 ovarian-workbench v3 与 breast-cancer-workbench prototypes/v0.3 的信息架构模式制作。</p><p class="small muted">模拟交互 · 未接入 DSH Desktop、AI、在线临床试验服务或真实患者资料。</p>`,btn('关闭','close','btn primary'))}}
document.addEventListener('click',handleAction);document.addEventListener('submit',e=>{if(e.target.id==='trial-search-form'){e.preventDefault();const b=e.target.querySelector('[data-action=trial-search]');b.click()}});
document.addEventListener('change',e=>{const a=e.target.dataset.action;if(a==='q-check'){const q=state.questions.find(x=>String(x.id)===e.target.dataset.id);if(q)q.selected=e.target.checked}else if(a==='doc-search'){}});
document.addEventListener('input',e=>{if(e.target.matches('[data-action="q-edit"]')){const q=state.questions.find(x=>String(x.id)===e.target.dataset.id);if(q)q.text=e.target.value}});
document.addEventListener('submit',e=>{if(e.target.id==='record-form'){e.preventDefault();const fd=new FormData(e.target),record={id:Date.now(),type:fd.get('type'),date:fd.get('date'),note:fd.get('note')};state.records.unshift(record);const kind=record.type.includes('治疗')||record.type.includes('放疗')?'treatment':record.type.includes('穿刺')||record.type.includes('胸水')?'procedure':record.type.includes('症状')||record.type.includes('活动')?'symptoms':'imaging';events.unshift({d:record.date,kind,title:record.type+' · 新记录',note:record.note||'未填写补充说明'});close();navigate('timeline');toast('已保存模拟记录（仅内存），并显示在时间轴') }});
$('#theme-toggle').addEventListener('click',e=>{const on=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=on?'dark':'light';e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'浅色':'深色'});
$('#font-toggle').addEventListener('click',e=>{const on=document.body.classList.toggle('font-large');e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'标准字 Aa':'大字 Aa'});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))close()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action="point"]')){e.preventDefault();const p=e.target;modal(`${p.dataset.name} · 记录详情`,`<div class="mini-stats"><div class="stat"><span>记录日期</span><strong>${p.dataset.date}</strong></div><div class="stat"><span>结果</span><strong>${p.dataset.value}</strong><small>${p.dataset.unit}</small></div></div><div class="info-box">来源：${esc(p.dataset.source)}（模拟）。真实产品应可打开对应报告原件。</div>`,btn('关闭','close','btn primary'))}});
render();
</script>
</body>
</html>
