<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eaf6fb">
<meta name="description" content="小肺宝 · 肺癌患者与照护者工作台 · 交互原型 v4（全部数据为模拟）">
<title>小肺宝 · 肺癌患者与照护者工作台原型 v4.1.0</title>
<style>
/* ============================================================
   小肺宝工作台原型 v4 · 样式表
   版式基线：瑞士平面网格 + 浅蓝/暖橙品牌色
   布局原则：全部栅格使用 minmax(0,1fr)，任何卡片内部不得撑破容器
   ============================================================ */

:root{
  --ink:#1e3a4c;
  --ink2:#3a5768;
  --muted:#6b8492;
  --blue:#267ba5;
  --blue-deep:#155c80;
  --blue-soft:#8ec4dd;
  --sky:#eaf6fb;
  --sky2:#d9eef8;
  --line:#dbe8ef;
  --line-soft:#eef4f7;
  --orange:#df7930;
  --orange-ink:#9b4f18;
  --orange-pale:#fff3e9;
  --green:#377963;
  --green-pale:#eaf5f0;
  --red:#a94a34;
  --red-pale:#fdf0ec;
  --paper:#f4f9fb;
  --white:#ffffff;
  --radius:16px;
  --radius-sm:11px;
  --shadow:0 8px 24px rgba(38,90,116,.055);
  --shadow-lg:0 18px 48px rgba(23,62,84,.16);
  --maxw:1520px;
  --sidebar:248px;
  --fs:14px;
  --lh:1.65;
  --focus:#1f75a0;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:var(--fs)/var(--lh) -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:.01em}
p{margin:0}
ul,ol{margin:0}
a{color:var(--blue-deep)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px;
  border-radius:6px;
}
button:disabled{opacity:.55;cursor:not-allowed}
::selection{background:var(--sky2)}

.skip{position:absolute;left:-9999px;top:0;z-index:50;background:var(--white);padding:10px 14px;border-radius:0 0 10px 0}
.skip:focus{left:0}

/* ---------- 原型状态条 ---------- */
.prototype-bar{
  min-height:32px;
  padding:5px 18px;
  background:#e3f2f8;
  color:#4b6c7c;
  font-size:11px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.prototype-bar b{color:var(--blue-deep)}

/* ---------- 工作区 ---------- */
.workspace{
  display:grid;
  grid-template-columns:var(--sidebar) minmax(0,1fr);
  min-height:calc(100vh - 32px);
}
.workspace>*{min-width:0}

/* ---------- 侧栏 ---------- */
.sidebar{
  position:sticky;
  top:0;
  height:calc(100vh - 32px);
  overflow-y:auto;
  overscroll-behavior:contain;
  background:var(--white);
  border-right:1px solid var(--line);
  padding:18px 14px 14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:3;
}
.brand{display:flex;gap:11px;align-items:center;padding:2px 6px 12px;min-width:0}
.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:var(--sky)}
.brand-text{min-width:0}
.brand strong{display:block;font-size:18px;line-height:1.2;letter-spacing:.02em}
.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px;line-height:1.4}

.profile{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:62px;
  border:1px solid var(--line);
  background:#f9fcfd;
  border-radius:12px;
  padding:9px 10px;
  text-align:left;
}
.profile:hover{border-color:#a9cde0;background:var(--sky)}
.profile .avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--sky2);color:var(--blue-deep);
  font-weight:700;display:grid;place-items:center;flex:none;font-size:13px;
}
.profile-body{min-width:0;flex:1}
.profile b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile small{display:block;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile .caret{color:var(--muted);font-size:11px;flex:none}

.nav{display:grid;gap:2px;margin-top:2px}
.nav-button{
  display:flex;align-items:center;gap:10px;
  width:100%;min-height:40px;padding:7px 10px;
  border:0;background:transparent;border-radius:10px;
  font-size:12.5px;color:var(--ink2);text-align:left;position:relative;
}
.nav-button:hover{background:#f2f8fb}
.nav-button[aria-current="page"]{background:var(--sky);color:var(--blue-deep);font-weight:700}
.nav-button[aria-current="page"]:before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--blue);
}
.nav-icon{width:18px;height:18px;flex:none;display:block}
.nav-icon svg{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{margin-left:auto;font-size:10px;background:var(--orange-pale);color:var(--orange-ink);border-radius:20px;padding:1px 7px;flex:none}

.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line-soft);padding:12px 6px 0;color:var(--muted);font-size:10px}
.sidebar-bottom>b{color:var(--blue-deep);font-size:10.5px;display:block}
.side-note{display:flex;gap:7px;align-items:flex-start;margin-top:9px;padding:9px;background:#f7fafb;border-radius:10px;line-height:1.5}
.side-note svg{width:13px;height:13px;flex:none;margin-top:2px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- 工作区主体 ---------- */
.work-area{display:flex;flex-direction:column;min-width:0}

.topbar{
  position:sticky;top:0;z-index:4;
  min-height:60px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;
  padding:8px clamp(14px,2.2vw,30px);
}
.breadcrumb{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.breadcrumb b{color:var(--ink2);font-weight:650}
.top-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.status,.top-btn,.version{
  border:1px solid var(--line);background:var(--white);border-radius:8px;
  min-height:32px;padding:5px 9px;font-size:11px;color:var(--ink2);white-space:nowrap;
}
.top-btn:hover{border-color:#a3cadf;background:var(--sky)}
.status{display:inline-flex;align-items:center;gap:5px}
.status i{width:6px;height:6px;border-radius:50%;background:#5f9d85;flex:none}
.status i.grey{background:#a9b8bf}
.status b{font-weight:650;color:var(--ink)}
.version{color:var(--muted);background:transparent;border-color:transparent;padding:5px 6px}
.version:hover{color:var(--blue-deep)}

.main{
  width:100%;
  max-width:var(--maxw);
  margin:0 auto;
  padding:22px clamp(14px,2.2vw,32px) 40px;
  flex:1;
  min-width:0;
}
.footer{
  border-top:1px solid var(--line);
  padding:12px clamp(14px,2.2vw,32px);
  font-size:10px;color:var(--muted);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--white);
}

/* ---------- 页头 ---------- */
.page-enter{animation:enter .18s ease-out}
@keyframes enter{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:0 0 16px;flex-wrap:wrap}
.page-head>div:first-child{min-width:0;flex:1 1 320px}
.eyebrow{font-size:10px;letter-spacing:.11em;color:var(--blue);font-weight:700;text-transform:uppercase}
.page-head h1{font-size:23px;line-height:1.3;margin:3px 0 4px}
.page-head p{color:var(--muted);font-size:12px;margin:0;max-width:78ch}
.head-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start}

/* ---------- 通用组件 ---------- */
.btn{
  border:1px solid #c9dde7;background:var(--white);border-radius:9px;
  padding:7px 12px;min-height:36px;font-size:12px;font-weight:550;
  display:inline-flex;gap:6px;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s;
}
.btn:hover{border-color:#8fbcd2;background:#f8fcfd}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep)}
.btn.soft{background:var(--sky);color:var(--blue-deep);border-color:var(--sky2)}
.btn.soft:hover{background:var(--sky2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue-deep);padding:6px 8px}
.btn.ghost:hover{background:var(--sky)}
.btn.small{min-height:30px;padding:4px 9px;font-size:11px}
.btn.wide{width:100%}
.btn.danger{color:var(--red);border-color:#eccfc6;background:var(--white)}
.btn[aria-pressed="true"]{background:var(--sky2);border-color:#a6cfe2;color:var(--blue-deep)}

.tag{
  display:inline-flex;align-items:center;gap:4px;
  border:1px solid var(--line);border-radius:99px;background:var(--white);
  padding:2px 8px;font-size:10px;color:var(--ink2);white-space:nowrap;line-height:1.7;
}
.tag.blue{background:var(--sky);border-color:#c9e5f1;color:var(--blue-deep)}
.tag.orange{background:var(--orange-pale);border-color:#f1d6c1;color:var(--orange-ink)}
.tag.green{background:var(--green-pale);border-color:#cfe4da;color:var(--green)}
.tag.gray{background:#f4f7f8;color:var(--muted)}
.tag.red{background:var(--red-pale);border-color:#eed3ca;color:var(--red)}

.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  min-width:0;
}
.card.flat{box-shadow:none}
.card h2{font-size:14px;line-height:1.4}
.card h3{font-size:12.5px;line-height:1.45}
.card h4{font-size:11.5px}
.card p{font-size:11.5px;color:var(--ink2)}
.muted{color:var(--muted)}
.small{font-size:11px}
.tiny{font-size:10px}
.num{font-variant-numeric:tabular-nums}
.wrap{overflow-wrap:anywhere;word-break:break-word}
.nowrap{white-space:nowrap}

.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:20px 0 10px;flex-wrap:wrap}
.section-title:first-child{margin-top:0}
.section-title h2{font-size:14px}
.section-title p{font-size:11px;color:var(--muted);margin:2px 0 0;max-width:80ch}
.section-title .link-btn{flex:none}
.link-btn{border:0;background:none;color:var(--blue-deep);font-size:11px;padding:4px 2px;border-radius:6px}
.link-btn:hover{text-decoration:underline}

.divider{height:1px;background:var(--line-soft);margin:12px 0}

.grid{display:grid;gap:13px;min-width:0;align-items:start}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g2e{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.auto-sm{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}

.stack{display:grid;gap:12px}
.stack-sm{display:grid;gap:7px}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.row>*{min-width:0}

/* ---------- 首页 ---------- */
.hero{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(230px,290px);
  gap:18px;
  align-items:stretch;
  padding:22px 24px;
  background:linear-gradient(112deg,#e9f6fc 0%,#f4fafc 62%,#fff5ec 100%);
  border:1px solid #d3e8f2;
  border-radius:20px;
  overflow:hidden;
}
.hero:after{
  content:"";position:absolute;right:-40px;top:-70px;width:230px;height:230px;
  border:1px solid #b6dcec;border-radius:50%;opacity:.5;pointer-events:none;
}
.hero-watermark{
  position:absolute;right:-24px;bottom:-40px;width:132px;height:132px;
  border-radius:50%;object-fit:cover;opacity:.08;pointer-events:none;
}
.hero-copy{position:relative;z-index:1;min-width:0}
.hero h2{font-size:22px;line-height:1.42;margin:5px 0 7px;padding-right:6px}
.hero p{max-width:64ch;color:#53707e;font-size:12px}
.hero-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero-next{
  position:relative;z-index:1;
  background:rgba(255,255,255,.92);
  border:1px solid #d6e7ee;
  border-radius:14px;
  padding:13px 14px;
  display:flex;flex-direction:column;gap:6px;
  min-width:0;
}
.hero-next .label{font-size:10px;color:var(--muted)}
.hero-next strong{font-size:13.5px;line-height:1.4}
.hero-next .meta{font-size:10px;color:var(--muted)}
.hero-next .btn{margin-top:4px;align-self:flex-start}

.task-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:9px}
.task-entry{
  position:relative;
  min-height:108px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--white);
  padding:13px;
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
}
.task-entry:hover{border-color:#8fbfd5;box-shadow:0 6px 18px rgba(48,122,153,.1);transform:translateY(-1px)}
.task-entry .task-icon{
  width:29px;height:29px;display:grid;place-items:center;border-radius:9px;
  background:var(--sky);color:var(--blue);font-size:14px;margin-bottom:2px;
}
.task-entry .task-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.task-entry b{font-size:12px;line-height:1.4}
.task-entry span.desc{font-size:10px;color:var(--muted);line-height:1.45}
.task-entry .arrow{position:absolute;right:11px;top:10px;color:#9fb9c6;font-size:12px}
.task-entry .badge{position:absolute;right:10px;bottom:9px;font-size:9px;color:var(--orange-ink);background:var(--orange-pale);border-radius:20px;padding:1px 6px}

.stat{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--white);min-width:0}
.stat span{display:block;color:var(--muted);font-size:10px;line-height:1.4}
.stat strong{display:block;font-size:17px;line-height:1.3;margin:2px 0;font-variant-numeric:tabular-nums}
.stat small{display:block;color:var(--muted);font-size:9.5px;line-height:1.4}
.stat.accent strong{color:var(--blue-deep)}
.stat.warn strong{color:var(--orange-ink)}

/* ---------- 时间线 ---------- */
.timeline{display:grid;gap:0}
.tl-item{display:grid;grid-template-columns:58px 14px minmax(0,1fr);gap:7px;padding:8px 0}
.tl-date{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.tl-dot{position:relative;display:flex;justify-content:center}
.tl-dot:before{content:"";position:absolute;top:9px;bottom:-14px;width:1px;background:#dbe8ee}
.tl-item:last-child .tl-dot:before{display:none}
.tl-dot i{width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:5px;position:relative;z-index:1;box-shadow:0 0 0 3px var(--white)}
.tl-item.orange .tl-dot i{background:var(--orange)}
.tl-item.green .tl-dot i{background:#4f9179}
.tl-item.gray .tl-dot i{background:#9aacb5}
.tl-item b{font-size:11.5px;line-height:1.45;display:block}
.tl-item p{font-size:10px;color:var(--muted);margin:1px 0 0;line-height:1.5}

/* ---------- 列表行 ---------- */
.list-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.list-row:last-child{border-bottom:0;padding-bottom:0}
.list-row:first-child{padding-top:0}
.list-row .body{min-width:0;flex:1}
.list-row b{font-size:11.5px;line-height:1.45;display:block}
.list-row p{font-size:10.5px;color:var(--muted);margin:1px 0 0;line-height:1.5}
.list-row .value{font-size:12.5px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.list-row .side{flex:none;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.row-actions{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}

.priority{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.priority:last-child{border-bottom:0;padding-bottom:0}
.priority .num{width:20px;height:20px;border-radius:7px;background:var(--orange-pale);color:var(--orange-ink);font-size:10px;display:grid;place-items:center;margin-top:1px}
.priority b{font-size:11.5px;line-height:1.45;display:block}
.priority p{font-size:10.5px;color:var(--muted);margin:1px 0 0}

.info-box{padding:10px 12px;border-radius:10px;background:#f1f8fb;color:#51707f;font-size:10.5px;line-height:1.6;margin-top:10px}
.info-box:first-child{margin-top:0}
.info-box.warm{background:#fff6ec;color:#8a5b31}
.info-box.plain{background:#f5f8f9;color:var(--ink2)}
.info-box.private{background:#f8f1f7;color:#7a4b70}
.info-box b{color:inherit}

.empty{padding:26px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:11.5px}
.empty h3{font-size:12.5px;color:var(--ink2);margin-bottom:4px}

/* ---------- 表格 ---------- */
.table-wrap{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--white);
}
table.data{width:100%;border-collapse:collapse;font-size:11px}
table.data th,table.data td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-soft);line-height:1.5}
table.data th{background:#f6fafb;color:var(--muted);font-weight:600;font-size:10px;letter-spacing:.02em;white-space:nowrap}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover{background:#fafdfe}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 窄窗按优先级收列：类型→开始→地区，先保住「操作」列，再退回卡内横滚 */
@media (max-width:1100px){table.data .col-md{display:none}}
@media (max-width:940px){table.data .col-sm{display:none}}
@media (max-width:840px){table.data .col-xs{display:none}}
.table-foot{padding:8px 10px;font-size:10px;color:var(--muted);border-top:1px solid var(--line-soft);background:#fbfdfe}

/* ---------- 表单 ---------- */
.field{display:grid;gap:4px;min-width:0}
.field>label,.field>span.lbl{font-size:10px;color:var(--muted);line-height:1.4}
.field input,.field select,.field textarea,input.search,textarea.search{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  background:var(--white);font-size:12px;min-height:36px;
}
.field textarea{min-height:74px;resize:vertical;line-height:1.6}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:#f6f9fa;color:var(--muted)}
.field input[type=checkbox],.field input[type=radio]{width:auto;min-height:0;accent-color:var(--blue)}
.field-help{font-size:9.5px;color:var(--muted);line-height:1.5}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
.form-grid .full{grid-column:1/-1}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.check-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 9px;border:1px solid var(--line);border-radius:99px;
  background:var(--white);font-size:10.5px;line-height:1.5;cursor:pointer;
}
.check-pill:hover{border-color:#a6cde0}
.check-pill input{accent-color:var(--blue);margin:0}
.check-pill[data-state="off"]{color:var(--muted)}
.check-pill .dot{width:6px;height:6px;border-radius:50%;background:#5f9d85;flex:none}
.check-pill .dot.grey{background:#a9b8bf}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.segmented{display:inline-flex;gap:2px;background:#f2f7f9;padding:3px;border-radius:9px;flex-wrap:wrap}
.segmented button{border:0;background:transparent;border-radius:7px;padding:5px 9px;font-size:10.5px;color:var(--muted)}
.segmented button[aria-pressed="true"]{background:var(--white);color:var(--blue-deep);font-weight:650;box-shadow:0 1px 3px rgba(25,63,85,.1)}

.subnav{
  display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);
  margin:0 0 14px;padding-bottom:0;scrollbar-width:thin;
}
.subnav button{
  border:0;background:none;padding:8px 11px;color:var(--muted);
  border-bottom:2px solid transparent;font-size:11px;white-space:nowrap;
}
.subnav button:hover{color:var(--ink2)}
.subnav button[aria-current="page"]{color:var(--blue-deep);font-weight:650;border-bottom-color:var(--blue)}

/* ---------- 图表 ---------- */
.chart-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.metric-selects{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chart-list{display:grid;gap:9px}
.metric-card{
  display:grid;grid-template-columns:minmax(100px,150px) minmax(0,1fr);
  gap:12px;align-items:center;
  border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--white);
}
.metric-card h3{font-size:11.5px}
.metric-latest{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.5}
.metric-svg{width:100%;height:104px;display:block;overflow:visible}
.metric-svg .gridline{stroke:#eef4f7;stroke-width:1}
.metric-svg .curve{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.metric-svg .point{stroke:var(--white);stroke-width:2;cursor:pointer}
.metric-svg .point:focus{stroke:var(--ink);stroke-width:2.6;outline:none}
.metric-svg text{font-size:9px;fill:#8b9ea8}
.metric-svg .band{fill:var(--sky);opacity:.5}

.event-track{display:grid;gap:7px}
.event-chip{border-left:3px solid var(--orange);border-radius:0 9px 9px 0;background:#fff8f2;padding:7px 10px;min-width:0}
.event-chip b{display:block;font-size:10.5px;line-height:1.45}
.event-chip span{display:block;color:var(--muted);font-size:9.5px;margin-top:1px;line-height:1.45}

/* 指标翻面卡：用 grid 叠层，避免 absolute 定位导致裁切 */
.flip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:10px}
.flip{
  display:block;width:100%;border:0;background:none;padding:0;
  text-align:left;perspective:1100px;min-width:0;
}
.flip-inner{
  position:relative;display:grid;min-height:156px;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);
}
.flip[aria-pressed="true"] .flip-inner{transform:rotateY(180deg)}
.flip-face{
  grid-area:1/1;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--line);border-radius:13px;background:var(--white);
  padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;
  min-width:0;overflow:hidden;
}
.flip-back{transform:rotateY(180deg);background:#f4fafc}
.flip-value{font-size:21px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.flip-value small{font-size:10px;font-weight:500;color:var(--muted)}
.flip-hint{font-size:9px;color:var(--muted);line-height:1.4}
.flip-face .txt{font-size:10.5px;line-height:1.5;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}

/* ---------- 问题清单 ---------- */
.question{display:grid;grid-template-columns:20px minmax(0,1fr) 30px;gap:8px;padding:10px 0;border-bottom:1px solid var(--line-soft);align-items:start}
.question:last-child{border-bottom:0}
.question input[type=checkbox]{accent-color:var(--blue);margin-top:4px}
.question textarea{
  width:100%;border:1px solid transparent;background:transparent;border-radius:8px;
  padding:3px 5px;font-size:11.5px;min-height:40px;resize:vertical;line-height:1.55;
}
.question textarea:hover{border-color:var(--line);background:#fbfdfe}
.question textarea:focus{border-color:#a6cde0;background:var(--white)}
.question small{display:block;font-size:9px;color:var(--muted);padding:0 5px}

/* ---------- 试验检索 ---------- */
.channel-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:8px}
.channel{
  display:flex;gap:8px;align-items:flex-start;
  border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:var(--white);
  text-align:left;min-width:0;
}
.channel:hover{border-color:#a6cde0}
.channel[aria-pressed="true"]{border-color:#9cc9de;background:var(--sky)}
.channel .dot{width:7px;height:7px;border-radius:50%;background:#5f9d85;margin-top:5px;flex:none}
.channel .dot.grey{background:#a9b8bf}
.channel .dot.amber{background:#d99a4e}
.channel-body{min-width:0;flex:1}
.channel b{display:block;font-size:10.5px;line-height:1.4}
.channel span{display:block;font-size:9.5px;color:var(--muted);line-height:1.45}
.channel .n{font-size:10px;color:var(--blue-deep);font-weight:650;white-space:nowrap}

.result-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
.result-head b{font-size:12px}
.trial-title{font-size:11px;line-height:1.5;color:var(--ink2)}
.trial-title b{color:var(--ink);font-weight:600}
.trial-empty{padding:24px;text-align:center;color:var(--muted);font-size:11.5px;border:1px dashed var(--line);border-radius:12px}

/* ---------- 设置面板 ---------- */
.cfg-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.cfg-tabs button{
  border:1px solid transparent;background:none;border-radius:8px;
  padding:6px 10px;font-size:11px;color:var(--muted);
}
.cfg-tabs button:hover{background:#f5f9fb;color:var(--ink2)}
.cfg-tabs button[aria-selected="true"]{background:var(--sky);color:var(--blue-deep);font-weight:650}
.cfg-block{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--white)}
.cfg-block+.cfg-block{margin-top:10px}
.cfg-block h3{font-size:12px;margin-bottom:3px}
.cfg-block p{font-size:10.5px;line-height:1.6;color:var(--ink2)}
.cfg-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.cfg-row:last-child{border-bottom:0;padding-bottom:0}
.cfg-row .body{min-width:0;flex:1}
.cfg-row b{font-size:11px;display:block;line-height:1.45}
.cfg-row p{font-size:10px;color:var(--muted);margin:1px 0 0;line-height:1.5}
.choice{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--white)}
.choice.on{border-color:#b8dbe9;background:#f8fcfe}
.choice-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:5px}
.check-row{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:10.5px;line-height:1.55;cursor:pointer}
.check-row input{accent-color:var(--blue);margin-top:2px;flex:none}
.token-row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
code.masked{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;background:#f3f7f9;border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--ink2)}

/* ---------- 对话框 ---------- */
.dialog{
  width:min(900px,calc(100vw - 22px));
  max-height:min(88vh,880px);
  border:1px solid var(--line);
  border-radius:18px;
  padding:0;
  background:var(--white);
  color:var(--ink);
  box-shadow:var(--shadow-lg);
  overflow:hidden;
}
.dialog[open]{display:flex;flex-direction:column}
.dialog::backdrop{background:rgba(18,48,64,.42);backdrop-filter:blur(2px)}
.dialog-head{
  flex:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line);background:var(--white);
}
.dialog-head h2{margin-top:2px;font-size:16px;line-height:1.35}
.dialog-body{flex:1;min-height:0;overflow:auto;padding:16px 18px;overscroll-behavior:contain}
.dialog-foot{
  flex:none;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;
  padding:11px 18px;border-top:1px solid var(--line);background:#fbfdfe;
}
.icon-button{
  width:32px;height:32px;flex:none;border-radius:8px;border:1px solid var(--line);
  background:var(--white);font-size:16px;line-height:1;display:grid;place-items:center;color:var(--ink2);
}
.icon-button:hover{background:#f5f9fb}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);
  background:#1e3a4c;color:#fff;padding:9px 15px;border-radius:10px;
  font-size:11.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60;
  max-width:calc(100vw - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 治疗轨 ---------- */
.lanes{display:grid;gap:5px;margin-top:6px}
.lane{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center}
.lane-label{font-size:9.5px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.lane-track{position:relative;height:22px;background:#f6fafb;border-radius:6px;border:1px solid var(--line-soft)}
.lane-bar{
  position:absolute;top:4px;bottom:4px;min-width:5px;border-radius:4px;
  background:var(--sky2);border:1px solid #c4e2ef;
}
.lane-bar.green{background:var(--green-pale);border-color:#cfe4da}
.lane-bar.orange{background:var(--orange-pale);border-color:#f1d6c1}
.lane-bar.solid{background:var(--blue-soft);border-color:#8ec4dd}
.lane-axis{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);line-height:1.4;margin-top:3px;padding-left:104px}
[data-theme="dark"] .lane-track{background:#21353f;border-color:var(--line-soft)}
[data-theme="dark"] .lane-bar{background:#2e4d5c;border-color:#3d6274;color:#c6ecfa}
[data-theme="dark"] .lane-bar.green{background:#263e36;border-color:#35594a;color:#a5d8bd}
[data-theme="dark"] .lane-bar.orange{background:#46352a;border-color:#604634;color:#f3bb90}

/* ---------- 大字 / 高对比 ---------- */
.font-large{--fs:16px}
.font-large .main{max-width:none}
.font-large .small,.font-large .tag,.font-large .status,.font-large .list-row p,.font-large .tl-item p{font-size:12px}
.font-large .tiny,.font-large .field-help{font-size:11px}
.font-large .page-head p{font-size:13px}
.font-large .card p{font-size:13px}

.contrast body{background:#fff}
.contrast{--muted:#4e6875;--line:#b9ccd6;--ink2:#2b475a}
.contrast .card,.contrast .stat,.contrast .task-entry{border-width:1.5px}

/* ---------- 深色 ---------- */
[data-theme="dark"]{
  color-scheme:dark;
  --ink:#e6eef3;
  --ink2:#c6d5de;
  --muted:#9db1bc;
  --blue:#6cbde0;
  --blue-deep:#a3dcf1;
  --sky:#223a47;
  --sky2:#2e4d5c;
  --line:#3a515e;
  --line-soft:#2c434f;
  --orange:#f0a06b;
  --orange-ink:#f3bb90;
  --orange-pale:#46352a;
  --green:#8bcbaa;
  --green-pale:#263e36;
  --red:#e9a38f;
  --red-pale:#4a2f28;
  --paper:#101f27;
  --white:#1b2f39;
  --shadow:0 8px 24px rgba(0,0,0,.22);
  --focus:#8fd3ef;
  --shadow-lg:0 18px 48px rgba(0,0,0,.5);
}
[data-theme="dark"] body{background:var(--paper);color:var(--ink)}
[data-theme="dark"] .prototype-bar{background:#1a303b;color:#b2c9d4}
[data-theme="dark"] .sidebar,
[data-theme="dark"] .topbar,
[data-theme="dark"] .card,
[data-theme="dark"] .task-entry,
[data-theme="dark"] .stat,
[data-theme="dark"] .metric-card,
[data-theme="dark"] .flip-face,
[data-theme="dark"] .profile,
[data-theme="dark"] .btn,
[data-theme="dark"] .top-btn,
[data-theme="dark"] .status,
[data-theme="dark"] .dialog,
[data-theme="dark"] .icon-button,
[data-theme="dark"] .channel,
[data-theme="dark"] .cfg-block,
[data-theme="dark"] .choice{background-color:var(--white);color:var(--ink);border-color:var(--line)}
[data-theme="dark"] .hero{background:linear-gradient(112deg,#1e3946 0%,#22343d 64%,#41332a 100%);border-color:var(--line)}
[data-theme="dark"] .hero p{color:#aec5d1}
[data-theme="dark"] .hero-next{background:rgba(27,47,57,.9);border-color:var(--line)}
[data-theme="dark"] .hero-watermark{opacity:.13}
[data-theme="dark"] .info-box{background:#20353f;color:#b6ccd8}
[data-theme="dark"] .info-box.warm,[data-theme="dark"] .notice{background:#3f3126;color:#f0c49b}
[data-theme="dark"] .info-box.plain{background:#253a45;color:var(--ink2)}
[data-theme="dark"] .info-box.private{background:#352b36;color:#e0b9d8}
[data-theme="dark"] .field input,
[data-theme="dark"] .field select,
[data-theme="dark"] .field textarea,
[data-theme="dark"] input.search,
[data-theme="dark"] textarea.search,
[data-theme="dark"] .tag,
[data-theme="dark"] .segmented,
[data-theme="dark"] .check-pill{background:#20343e;color:var(--ink);border-color:var(--line)}
[data-theme="dark"] .segmented button[aria-pressed="true"]{background:#2e4d5c;color:#c6ecfa}
[data-theme="dark"] table.data th{background:#243a45;color:var(--muted)}
[data-theme="dark"] table.data tbody tr:hover{background:#22363f}
[data-theme="dark"] .table-foot{background:#1f333d}
[data-theme="dark"] .metric-svg .gridline{stroke:#31474f}
[data-theme="dark"] .metric-svg .point{stroke:#1b2f39}
[data-theme="dark"] .tl-dot i{box-shadow:0 0 0 3px #1b2f39}
[data-theme="dark"] .tl-dot:before{background:#33494f}
[data-theme="dark"] .event-chip{background:#3a2f26}
[data-theme="dark"] .flip-back{background:#243a45}
[data-theme="dark"] .tag.orange{background:#46352a;color:#f3bb90;border-color:#604634}
[data-theme="dark"] .tag.green{background:#263e36;color:#a5d8bd;border-color:#35594a}
[data-theme="dark"] .tag.blue{background:#223a47;color:#a3dcf1;border-color:#395a6b}
[data-theme="dark"] .tag.red{background:#4a2f28;color:#f0b4a2;border-color:#67423a}
[data-theme="dark"] .nav-button:hover{background:#263c47}
[data-theme="dark"] .nav-button[aria-current="page"]{background:#223a47;color:#b6e6f7}
[data-theme="dark"] .btn.primary{background:#2a7fa4;color:#fff;border-color:#2a7fa4}
[data-theme="dark"] .btn:hover{background:#2a434f}
[data-theme="dark"] .cfg-tabs button[aria-selected="true"]{background:#223a47;color:#b6e6f7}
[data-theme="dark"] code.masked{background:#20343e}
[data-theme="dark"] .toast{background:#dbeaf0;color:#10202a}
[data-theme="dark"] .footer{background:var(--white)}
[data-theme="dark"] .dialog-foot{background:#1a2d36}
[data-theme="dark"] .empty{border-color:var(--line)}

/* ---------- 响应式 ---------- */
@media(max-width:1280px){
  .g2{grid-template-columns:minmax(0,1fr)}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr) minmax(210px,250px)}
}
@media(max-width:1024px){
  :root{--sidebar:216px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-watermark{width:110px;height:110px;right:-10px;bottom:-36px}
  .g2e{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:880px){
  .workspace{grid-template-columns:minmax(0,1fr)}
  .sidebar{
    position:relative;top:auto;height:auto;max-height:none;
    border-right:0;border-bottom:1px solid var(--line);
    padding:10px 12px 8px;gap:7px;
  }
  .brand{padding:0 4px 6px}
  .brand img{width:38px;height:38px}
  .profile{display:none}
  .nav{display:flex;gap:4px;overflow-x:auto;margin:0 -2px;padding-bottom:4px;scrollbar-width:thin}
  .nav-button{width:auto;min-height:36px;padding:6px 9px;white-space:nowrap;font-size:11.5px}
  .nav-button[aria-current="page"]:before{display:none}
  .nav-count{display:none}
  .sidebar-bottom{display:none}
  .topbar{position:relative;flex-wrap:wrap}
  .main{padding-top:16px}
  .metric-card{grid-template-columns:minmax(0,1fr)}
  .flip-inner{min-height:150px}
}
@media(max-width:620px){
  .prototype-bar{justify-content:center;text-align:center;line-height:1.45;padding:6px 12px}
  .prototype-bar span:last-child{display:none}
  .top-actions{gap:4px}
  .status span{display:none}
  .version{display:none}
  .main{padding:14px 12px 30px}
  .page-head{display:block}
  .page-head h1{font-size:20px}
  .head-actions{justify-content:flex-start;margin-top:10px}
  .hero{padding:17px}
  .hero h2{font-size:19px}
  .hero-watermark{display:none}
  .g3,.g4{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .flip-grid{grid-template-columns:minmax(0,1fr)}
  .task-grid{grid-template-columns:minmax(0,1fr)}
  .footer span:last-child{display:none}
  .dialog{width:calc(100vw - 12px);max-height:92vh}
  .dialog-body{padding:13px}
  .dialog-head{padding:12px 13px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after{
  animation-duration:.01ms!important;transition-duration:.01ms!important;
}
</style>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>

<div class="prototype-bar">
  <span><b>小肺宝 · 交互原型 v4.1.0</b>　全部病例、检验值与治疗记录均为模拟演示数据</span>
  <span>本地演示 · 刷新重置 · 未接入 DSH / AI / 真实病历 / 在线登记服务</span>
</div>

<div class="workspace">
  <aside class="sidebar" aria-label="小肺宝工作台导航">
    <div class="brand">
      <img src="assets/brand/lung-care-logo.png" alt="小肺宝品牌标识" width="44" height="44" onerror="this.style.display='none'">
      <div class="brand-text">
        <strong>小肺宝</strong>
        <span>陪你一起理清肺癌旅程</span>
      </div>
    </div>

    <button class="profile" data-action="profiles" aria-label="切换模拟患者档案">
      <span class="avatar" id="avatar">林</span>
      <span class="profile-body">
        <b id="profile-name">林女士的资料</b>
        <small id="profile-meta">NSCLC · 术后随访</small>
      </span>
      <span class="caret" aria-hidden="true">⌄</span>
    </button>

    <nav class="nav" id="nav" aria-label="主功能"></nav>

    <div class="sidebar-bottom">
      <b>小肺宝 · 陪伴式工作台</b>
      <div class="side-note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
        <span>只展示已记录与待核对信息。模拟示例不构成诊断、治疗建议或入组判断。</span>
      </div>
    </div>
  </aside>

  <div class="work-area">
    <header class="topbar">
      <div class="breadcrumb">小肺宝工作台　/　<b id="breadcrumb">看板</b></div>
      <div class="top-actions">
        <span class="status" id="status-store" title="资料目录状态"><i class="grey"></i><span>资料目录</span><b>未连接</b></span>
        <span class="status" id="status-ai" title="AI 助手状态"><i class="grey"></i><span>AI</span><b>未接入</b></span>
        <button class="top-btn" data-action="settings" aria-label="打开设置">⚙ 设置</button>
        <button class="top-btn" id="theme-toggle" data-action="theme" aria-pressed="false">深色</button>
        <button class="top-btn" id="font-toggle" data-action="font" aria-pressed="false">大字 Aa</button>
        <button class="version" data-action="about">v4.1.0</button>
      </div>
    </header>

    <main class="main" id="main" tabindex="-1"></main>

/* ============================================================

   ============================================================ */
const btn = (text, action, cls = 'btn', extra = '') => `<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`;
const tag = (text, cls = 'blue') => `<span class="tag ${cls}">${text}</span>`;
const emptyBox = (title, text) => `<div class="empty"><h3>${title}</h3><p>${text}</p></div>`;

function head(title, desc, actions = '') {
  const p = current();
  return `<div class="page-head">
    <div>
      <span class="eyebrow">${esc(p.kind)} · ${esc(p.stage)}</span>
      <h1>${title}</h1>
      <p>${desc}</p>
    </div>
    <div class="head-actions">${actions}</div>
  </div>`;
}
function section(title, sub = '', right = '') {
  return `<div class="section-title"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${right || ''}</div>`;
}
function subnav(page) {
  const items = SUBPAGES[page] || [];
  if (!items.length) return '';
  const cur = state.sub[page] || items[0];
  return `<div class="subnav" role="tablist" aria-label="页面分区">${items.map((s) =>
    `<button role="tab" aria-selected="${cur === s}" aria-current="${cur === s ? 'page' : 'false'}" data-action="sub" data-page="${page}" data-sub="${s}">${s}</button>`
  ).join('')}</div>`;
}
function dataTable(headers, rows, opts = {}) {
  /* colCls：按列给收列类名（col-md / col-sm / col-xs），窄窗时按优先级隐藏次要列，
     避免表格把「操作」列推出卡外、只剩卡内横滚。 */
  const cellCls = (i) => [opts.numCols?.includes(i) ? 'num' : '', opts.colCls?.[i] || ''].filter(Boolean).join(' ');
  const th = headers.map((h, i) => `<th class="${cellCls(i)}">${h}</th>`).join('');
  const body = rows.length
    ? rows.map((r) => `<tr>${r.map((c, i) => `<td class="${cellCls(i)}">${c}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${headers.length}" class="muted">没有符合条件的记录</td></tr>`;
  return `<div class="table-wrap"><table class="data"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>${opts.foot ? `<div class="table-foot">${opts.foot}</div>` : ''}</div>`;
}
function timeline(items, limit = 99) {
  const list = items.slice(0, limit);
  if (!list.length) return emptyBox('还没有记录', '任何一条记录都可以从这里开始，缺失不会被记成零。');
  return `<div class="timeline">${list.map((e) => {
    const cls = e.kind === 'treatment' ? 'green' : (e.kind === 'procedure' || e.kind === 'symptom') ? 'orange' : e.kind === 'visit' ? 'gray' : '';
    return `<div class="tl-item ${cls}"><span class="tl-date num">${md(e.d)}</span><span class="tl-dot"><i></i></span><div><b>${esc(e.title)}</b><p>${esc(e.note)}</p></div></div>`;
  }).join('')}</div>`;
}
function statBox(label, value, small, cls = '') {
  return `<div class="stat ${cls}"><span>${label}</span><strong>${value}</strong><small>${small}</small></div>`;
}
function keyInfoCard() {

  else if (sub === '待核对草稿') body = recordsCandidates();
  else if (sub === '诊断与分期') body = recordsStaging();

  return head('病情整理', SUBTITLES.records,
    btn('＋ 添加资料记录', 'record', 'btn primary') +
    btn('选择资料目录', 'choose-store', 'btn')
  ) + subnav('records') + body;
}

/* ============================================================

   ============================================================ */
function rangeEnd() {
  const p = current();
  const dates = p.events.map((e) => e.d).concat(...Object.values(p.series).map((s) => s.map((x) => x[0])));
  return dates.sort().slice(-1)[0] || today;
}
function inRange(date) {
  if (state.range === 'all') return true;
  const months = Number(state.range.replace('m', ''));
  const end = ndate(rangeEnd());
  const start = new Date(end);
  start.setMonth(start.getMonth() - months);
  return ndate(date) >= start;
}
function seriesInRange(key) {
  const p = current();
  return (p.series[key] || []).filter((x) => inRange(x[0]));
}

function sparkSvg(key) {
  const m = METRICS[key];
  const pts = seriesInRange(key);
  if (!pts.length) return `<div class="empty">所选时间范围内没有 ${m.name} 记录。</div>`;
  const w = 460, h = 104, padL = 28, padR = 14, padT = 14, padB = 22;
  const vals = pts.map((x) => x[1]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = max - min || Math.max(Math.abs(max) * 0.1, 1);
  const x = (i) => (pts.length === 1 ? (w - padL - padR) / 2 + padL : padL + (i * (w - padL - padR)) / (pts.length - 1));
  const y = (v) => padT + ((max - v) / span) * (h - padT - padB);
  const coords = pts.map((p, i) => ({ x: x(i), y: y(p[1]), d: p[0], v: p[1] }));
  const path = coords.map((c, i) => `${i ? 'L' : 'M'}${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  return `<svg class="metric-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${m.name} 变化示意，独立刻度">
    <line class="gridline" x1="${padL}" x2="${w - padR}" y1="${padT + 6}" y2="${padT + 6}"/>
    <line class="gridline" x1="${padL}" x2="${w - padR}" y1="${(h - padB + padT) / 2}" y2="${(h - padB + padT) / 2}"/>
    <line class="gridline" x1="${padL}" x2="${w - padR}" y1="${h - padB}" y2="${h - padB}"/>
    <text x="2" y="${padT + 9}" text-anchor="start">${max}</text>
    <text x="2" y="${h - padB + 3}" text-anchor="start">${min}</text>
    ${pts.length > 1 ? `<path class="curve" style="stroke:${m.color}" d="${path}"/>` : ''}
    ${coords.map((c) => `<circle class="point" tabindex="0" role="button" fill="${m.color}"
        aria-label="${c.d} ${m.name} ${c.v} ${m.unit}，查看记录详情"
        data-action="point" data-date="${c.d}" data-name="${m.name}" data-value="${c.v}" data-unit="${m.unit}"
        cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4.4"/>`).join('')}
    <text x="${padL}" y="${h - 5}">${pts[0][0].slice(2)}</text>
    <text x="${w - padR}" y="${h - 5}" text-anchor="end">${pts[pts.length - 1][0].slice(2)}</text>
  </svg>
  ${pts.length === 1 ? '<p class="tiny muted" style="margin-top:2px">只有一个记录点，不连线。</p>' : ''}`;
}

function lanes() {
  const p = current();
  if (!p.treatments.length) return emptyBox('还没有治疗记录', '手术、放疗、化疗、靶向都可以单独记录，计划与实际分开。');
  const end = ndate(rangeEnd());
  const start = new Date(end);
  start.setMonth(start.getMonth() - (state.range === 'all' ? 18 : Number(state.range.replace('m', ''))));
  const spanMs = Math.max(end - start, 1);
  const pos = (d) => Math.min(100, Math.max(0, ((ndate(d) - start) / spanMs) * 100));
  const items = p.treatments.filter((t) => t.start && ndate(t.start) >= start);
  if (!items.length) return emptyBox('所选时间窗内没有治疗记录', '把时间范围放大，或补一条治疗记录。');
  const legend = { 手术: '', 靶向: 'green', 免疫: 'green', 化疗: 'solid', 放疗: 'orange', 随访: 'solid', 操作: 'orange' };
  return `<div class="lanes">
    ${items.map((t) => {
      const left = pos(t.start);
      let right;
      if (t.end) right = pos(t.end);
      else if (t.status === '进行中') right = 100;
      else right = left;
      const width = Math.max(right - left, 0.8);
      const cls = legend[t.cat] !== undefined ? legend[t.cat] : '';
      const tip = `${t.name} · ${t.start}${t.end ? ' 至 ' + t.end : t.status === '进行中' ? ' 起（进行中）' : ' 单次记录'}`;
      return `<div class="lane">
        <span class="lane-label" title="${esc(t.name)}">${esc(t.name)}</span>
        <div class="lane-track"><span class="lane-bar ${cls}" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%" title="${esc(tip)}"></span></div>
      </div>`;
    }).join('')}
  </div>
  <div class="lane-axis"><span>${start.toISOString().slice(0, 7)}</span><span>${rangeEnd().slice(0, 7)}</span></div>
  <div class="chip-row" style="margin-top:8px">
    <span class="tiny muted">图例</span>

}

function flipCard(key) {
  const m = METRICS[key], p = current(), s = p.series[key] || [];
  if (!s.length) {
    return `<div class="flip-face" style="min-height:170px"><span class="muted small">${m.name}</span><b>未记录</b><span class="flip-hint">没有记录时不显示 0，也不绘制假曲线。</span></div>`;
  }
  const last = s[s.length - 1];
  return `<button class="flip" aria-pressed="false" data-action="flip" aria-label="${m.name} 指标卡，翻转查看说明">
    <span class="flip-inner">
      <span class="flip-face">
        <span class="muted small">${m.name} · 最近记录</span>
        <span class="flip-value">${last[1]}<small> ${m.unit}</small></span>

    </span>
  </button>`;
}

function weightSvg(p) {
  const pts = p.weight || [];
  if (!pts.length) return `<div class="empty">还没有体重记录。可以不填，缺失不会被记成 0。</div>`;
  const w = 440, h = 112, padL = 34, padR = 12, padT = 14, padB = 22;
  const vals = pts.map((x) => x[1]);
  const min = Math.min(...vals) - 1, max = Math.max(...vals) + 1;
  const span = max - min || 1;
  const x = (i) => (pts.length === 1 ? w / 2 : padL + (i * (w - padL - padR)) / (pts.length - 1));
  const y = (v) => padT + ((max - v) / span) * (h - padT - padB);
  const path = pts.map((pt, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(pt[1]).toFixed(1)}`).join(' ');
  return `<svg class="metric-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="体重变化示意">
    <line class="gridline" x1="${padL}" x2="${w - padR}" y1="${padT + 6}" y2="${padT + 6}"/>
    <line class="gridline" x1="${padL}" x2="${w - padR}" y1="${h - padB}" y2="${h - padB}"/>
    <text x="2" y="${padT + 9}">${max.toFixed(1)}</text>
    <text x="2" y="${h - padB + 2}">${min.toFixed(1)}</text>
    ${pts.length > 1 ? `<path class="curve" style="stroke:#377963" d="${path}"/>` : ''}
    ${pts.map((pt, i) => `<circle class="point" fill="#377963" cx="${x(i).toFixed(1)}" cy="${y(pt[1]).toFixed(1)}" r="4.2"
        role="button" tabindex="0" data-action="point" data-date="${pt[0]}" data-name="体重" data-value="${pt[1]}" data-unit="kg" data-source="患者自述 / 体重记录"
        aria-label="${pt[0]} 体重 ${pt[1]} kg"/>`).join('')}
    <text x="${padL}" y="${h - 5}">${pts[0][0].slice(2)}</text>
    <text x="${w - padR}" y="${h - 5}" text-anchor="end">${pts[pts.length - 1][0].slice(2)}</text>
  </svg>${pts.length === 1 ? '<p class="tiny muted" style="margin-top:2px">只有一个记录点，不连线。</p>' : ''}`;
}

function trialFiltered() {
  const t = state.trial;
  const q = t.q.trim().toLowerCase();
  let rows = TRIALS.filter((x) => {
    if (t.hist && x.hist !== t.hist) return false;
    if (t.phase && x.phase !== t.phase) return false;
    if (t.status && (x.status || '未报告') !== t.status) return false;
    if (t.target && !x.targets.includes(t.target)) return false;
    if (t.region && x.region !== t.region) return false;
    if (q) {
      const hay = [x.id, x.title, x.sponsor || '', x.hist, x.phase || '', ...(x.drugs || []), ...(x.targets || [])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (t.sort === 'start') rows.sort((a, b) => String(b.start || '').localeCompare(String(a.start || '')));
  if (t.sort === 'id') rows.sort((a, b) => a.id.localeCompare(b.id));
  if (t.sort === 'phase') rows.sort((a, b) => String(a.phase || '').localeCompare(String(b.phase || '')));
  return rows;
}

  const r = TRIALS.find((x) => x.id === id);

  if (!r.region.includes('中国') && !r.region.includes('全球')) gaps.push('研究地区不含中国大陆，需确认是否有可及中心');

function navigate(page, sub) {
  state.page = page;

  render();

}

function mapKind(type) {
  if (/治疗|用药|放疗/.test(type)) return 'treatment';
  if (/穿刺|标本|操作/.test(type)) return 'procedure';
  if (/病理|分子/.test(type)) return 'pathology';
  if (/影像|检验/.test(type)) return 'imaging';
  if (/症状|营养/.test(type)) return 'symptom';
  if (/手术/.test(type)) return 'treatment';
  return 'imaging';
}

      <div class="field"><label for="nq-text">想问营养相关的问题</label>
        <textarea id="nq-text" name="text" placeholder="例如：最近三周体重下降了 3 公斤，需要现在就看营养师吗？"></textarea></div>
    </form>`, `${btn('取消', 'close', 'btn')}<button class="btn primary" type="submit" form="nutriq-form">加入复诊清单</button>`, '营养支持');
}

function privateQModal(topic) {
  state.pendingTopic = topic || '';
  modal(`私密问题 · ${topic || ''}`, `<div class="info-box private">默认不进一图秀、就诊摘要、导出或 Agent 预览。</div>
    <form id="privateq-form" style="margin-top:10px">
      <div class="field"><label for="pq-text">只写给自己看</label>
        <textarea id="pq-text" name="text" placeholder="可以只写一句，也可以先不写。"></textarea></div>
      <div class="field"><label for="pq-owner">属于谁</label>
        <select id="pq-owner" name="owner"><option>患者本人</option><option>照护者自己</option></select></div>
    </form>`, `${btn('取消', 'close', 'btn')}<button class="btn primary" type="submit" form="privateq-form">私密保存</button>`, '心理支持');
}

function hemoptysisAfterModal() {
  const c = state.cfg.contacts || {};
  modal('已记录 · 联系入口', `<div class="stack">
      <div class="info-box warm"><b>如果现在还在出血，或伴呼吸困难、胸痛、头晕/晕厥：</b><br>请直接使用当地急救服务（中国大陆 120），不要等待本条记录被查看。</div>
      <div class="card flat">
        ${section('你配置的联系路径', '未配置时只显示通用方式。')}
        <div class="list-row"><div class="body"><b>治疗团队</b><p>${esc(c.team || '未配置')}</p></div>${tag(c.team ? '已填写' : '待填写', c.team ? 'green' : 'orange')}</div>
        <div class="list-row"><div class="body"><b>就近急诊</b><p>${esc(c.er || '未配置')}</p></div>${tag(c.er ? '已填写' : '待填写', c.er ? 'green' : 'orange')}</div>
        <div class="list-row"><div class="body"><b>当地急救</b><p>中国大陆 120；其他地区用当地号码</p></div>${tag('通用', 'gray')}</div>
      </div>
      <p class="small muted">此处不做轻/中/重分级，也不建议等到下次复诊。</p>
    </div>`, `${btn('填写联系信息', 'contact-config', 'btn')}${btn('关闭', 'close', 'btn primary')}`, '安全入口');
}

function onClick(e) {
  const t = e.target;
  if (!(t instanceof Element)) return;
  const el = t.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const p = current();

  switch (a) {
    case 'noop': return;
    case 'go': navigate(el.dataset.page, el.dataset.sub); return;
    case 'sub':
      state.sub[el.dataset.page] = el.dataset.sub;
      render();
      return;
    case 'range':
      state.range = el.dataset.range;
      render();
      return;
    case 'flip':
      el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') !== 'true');
      return;
    case 'record': recordModal(); return;
    case 'quick-symptom': quickSymptomModal(); return;
    case 'close': closeModal(); return;
    case 'profiles': profileModal(); return;
    case 'choose-profile':
      state.profile = el.dataset.profile;
      state.metrics = Object.keys(current().series).filter((k) => METRICS[k]).slice(0, 2);
      closeModal(); render(); toast('已切换到 ' + current().name + '（模拟档案）');
      return;
    case 'point': pointModal(el); return;
    case 'add-q': {
      const text = el.dataset.question || '';
      if (!text) return;
      p.questionList.push({ id: Date.now(), text, source: '来自工作台模板 · 模拟', selected: true });
      closeModal();
      if (state.page === 'review') render(); else navigate('review');
      toast('已加入复诊清单');
      return;
    }
    case 'question-bank': questionBankModal(); return;
    case 'q-delete':
      p.questionList = p.questionList.filter((q) => String(q.id) !== el.dataset.id);
      render();
      return;
    case 'preview': previewModal(); return;
    case 'keep-outline': keepOutline(); return;
    case 'kept-open': keptModal(el.dataset.id); return;
    case 'kept-drop':
      state.kept = state.kept.filter((k) => String(k.id) !== String(el.dataset.id));
      if ($('#dialog').open) closeModal();
      render();
      toast('已删除这份保留（不影响问题清单）');
      return;
    case 'export-md': exportModal(); return;
    case 'ask': askModal(); return;
    case 'add-advice': adviceModal(); return;
    case 'pack':
      state.pack[el.dataset.key] = !state.pack[el.dataset.key];
      render();
      return;
    case 'settings': settingsModal(); return;
    case 'cfg-tab': settingsModal(el.dataset.tab); return;
    case 'toggle-token':
      state.cfg.showToken = !state.cfg.showToken;
      settingsModal('parse');
      return;
    case 'save-token': toast('Token 校验通过（模拟，不会真的保存）'); return;
    case 'db-check':
      state.cfg.dbChecked = '2026-10-17 20:31';
      toast('已检查：演示快照，无需更新');
      settingsModal('clinic');
      return;
    case 'db-import': toast('原型不读取本地库文件'); return;
    case 'theme':
      state.cfg.theme = state.cfg.theme === 'dark' ? 'light' : 'dark';
      applyDisplay();
      return;
    case 'font':
      state.cfg.font = state.cfg.font === 'large' ? 'normal' : 'large';
      applyDisplay();
      return;
    case 'theme-set':
      state.cfg.theme = el.dataset.value;
      applyDisplay(); settingsModal('display');
      return;
    case 'font-set':
      state.cfg.font = el.dataset.value;
      applyDisplay(); settingsModal('display');
      return;
    case 'contrast-set':
      state.cfg.contrast = el.dataset.value;
      applyDisplay(); settingsModal('display');
      return;
    case 'reduce-motion':
      state.cfg.reduce = !state.cfg.reduce;
      applyDisplay(); settingsModal('display');
      return;
    case 'resolve-gap':
      p.gaps.splice(Number(el.dataset.idx), 1);
      render();
      toast('已标记为核对完成（仅本页内存）');
      return;
    case 'choose-store': chooseStoreModal(); return;
    case 'store-pick':
      state.cfg.storePath = el.dataset.path;
      closeModal(); render();
      toast('已选择示例目录（未真实写入）');
      return;
    case 'add-nutri-q': nutriQModal(); return;
    case 'private-q': privateQModal(el.dataset.topic); return;
    case 'hemoptysis-record': hemoptysisModal(); return;
    case 'contact-config': contactModal(); return;
    case 'toggle-metrics': toggleMetricsModal(); return;
    case 'about': aboutModal(); return;
    case 'channel': {
      const id = el.dataset.id;
      const on = !state.trial.channels[id];
      state.trial.channels[id] = on;
      if (id !== 'local' && on) toast('该通道未授权，检索时不会返回结果');
      render();
      return;
    }
    case 'trial-detail': trialDetail(el.dataset.id); return;
    case 'trial-save': {
      const id = el.dataset.id;
      const i = state.trial.saved.indexOf(id);
      if (i >= 0) state.trial.saved.splice(i, 1); else state.trial.saved.push(id);
      renderMain();
      if ($('#dialog').open) closeModal();
      toast(i >= 0 ? '已取消收藏' : '已收藏（仅本页内存）');
      return;
    }
    case 'trial-reset':
      state.trial.q = ''; state.trial.hist = ''; state.trial.phase = '';
      state.trial.status = ''; state.trial.target = ''; state.trial.region = '';
      state.trial.sort = 'start'; state.trial.ran = false;
      render();
      toast('已重置检索条件');
      return;
    case 'trial-check': toast('演示快照：不联网，未检查更新'); return;
    case 'ext-link':
      window.open(el.dataset.url, '_blank', 'noopener');
      return;
    default: return;
  }
}

function onSubmit(e) {
  const f = e.target;
  if (!f || !f.id) return;
  e.preventDefault();
  const fd = new FormData(f);
  const p = current();

  if (f.id === 'record-form') {
    const type = fd.get('type'), date = fd.get('date') || today;
    const layer = fd.get('layer'), title = (fd.get('title') || '').trim() || type + ' · 新记录';
    const note = (fd.get('note') || '').trim();
    p.events.push({ d: date, kind: mapKind(type), title, note: `${layer} · ${note || '未填写补充说明'}` });
    closeModal();
    navigate('timeline');
    toast('已保存模拟记录，并显示在时间轴');
    return;
  }
  if (f.id === 'symptom-form') {
    const names = fd.getAll('items');
    const list = names.length ? names : ['身体变化'];
    const detail = (fd.get('detail') || '').trim() || '未填写具体描述';
    const level = fd.get('level');
    const date = fd.get('date') || today;
    list.forEach((n) => p.symptoms.unshift({ d: date, name: n, detail: `${level} · ${detail}`, src: '患者自述' }));
    p.events.push({ d: date, kind: 'symptom', title: '症状记录：' + list.join('、'), note: detail });
    closeModal(); render(); toast('已保存 ' + list.length + ' 条自述');
    return;
  }
  if (f.id === 'hemoptysis-form') {
    const amount = fd.get('amount');
    const acc = fd.getAll('accompany');
    const note = (fd.get('note') || '').trim();
    const date = fd.get('date') || today;
    const detail = `量：${amount}${acc.length ? '；伴随：' + acc.join('、') : ''}${note ? '；' + note : ''}`;
    p.symptoms.unshift({ d: date, name: '痰中带血 / 咯血', detail, src: '患者自述' });
    p.events.push({ d: date, kind: 'symptom', title: '咯血 / 血性痰记录', note: detail });
    closeModal();
    render();
    hemoptysisAfterModal();
    return;
  }
  if (f.id === 'contact-form') {
    state.cfg.contacts = { team: fd.get('team'), er: fd.get('er'), note: fd.get('note') };
    closeModal(); render(); toast('已保存联系路径（模拟，仅本页）');
    return;
  }
  if (f.id === 'nutri-form') {
    const date = today;
    const weight = fd.get('weight');
    p.nutrition.unshift({
      d: date,
      intake: fd.get('intake') || '未填进食情况',
      weight,
      note: [fd.get('difficulty') ? '困难：' + fd.get('difficulty') : '', fd.get('note') || ''].filter(Boolean).join(' · '),
      by: fd.get('by')
    });
    if (weight) {
      p.weight.push([date, Number(weight)]);
      p.weight.sort((x, y) => x[0].localeCompare(y[0]));
      p.events.push({ d: date, kind: 'symptom', title: '体重记录 ' + weight + ' kg', note: '患者自述 · 营养支持' });
    }
    render(); toast('已保存营养记录（仅本页内存）');
    return;
  }
  if (f.id === 'mind-form') {
    p.mind.unshift({
      d: today,
      owner: fd.get('owner'),
      note: [(fd.get('mood') ? '近的词：' + fd.get('mood') + '。' : ''), (fd.get('note') || '').trim() || '（未写内容）', fd.get('sharing') ? '允许在提纲中以「我的感受」出现' : ''].filter(Boolean).join(' '),
      private: true,
      sharing: !!fd.get('sharing')
    });
    render(); toast('已私密保存（不进摘要）');
    return;
  }
  if (f.id === 'caregiver-form') {
    p.mind.unshift({
      d: today,
      owner: '照护者自己',
      note: [(fd.get('sleep') ? '睡眠：' + fd.get('sleep') + '。' : ''), (fd.get('load') ? '最占精力：' + fd.get('load') + '。' : ''), (fd.get('note') || '').trim() || '（未写内容）'].filter(Boolean).join(' '),
      private: true,
      sharing: false
    });
    render(); toast('已私密保存 · 不会写成患者的症状');
    return;
  }
  if (f.id === 'advice-form') {
    p.advice = p.advice || [];
    p.advice.unshift({
      d: fd.get('date') || today,
      source: (fd.get('source') || '').trim(),
      text: (fd.get('text') || '').trim(),
      cond: (fd.get('cond') || '').trim()
    });
    closeModal(); render(); toast('已保存建议原文（模拟）');
    return;
  }
  if (f.id === 'ask-form') {
    const text = (fd.get('text') || '').trim();
    if (!text) return;
    p.questionList.push({ id: Date.now(), text, source: '本人添加 · 模拟', selected: true, kind: fd.get('kind') || 'fact' });
    closeModal(); render();
    toast(fd.get('kind') === 'view' ? '已作为「我的看法」保存，不会被当成结论' : '已加入问题清单');
    return;
  }
  if (f.id === 'immune-form') {
    const items = fd.getAll('items');
    const level = fd.get('level');
    const note = (fd.get('note') || '').trim();
    const date = fd.get('date') || today;
    (items.length ? items : ['免疫治疗期间身体变化']).forEach((n) =>
      p.symptoms.unshift({ d: date, name: n, detail: `${level} · ${note || '未填写补充描述'}`, src: '患者自述' }));
    p.events.push({ d: date, kind: 'symptom', title: '免疫治疗期间身体变化', note: note || '未填写补充描述' });
    render(); toast('已保存，未判断是否为免疫相关不良事件');
    return;
  }
  if (f.id === 'pleural-form') {
    const rec = {
      d: fd.get('date') || today, side: fd.get('side'), type: fd.get('type'),
      volume: fd.get('volume') || '未记录', fluid: fd.get('fluid') || '未记录',
      note: fd.get('note') || '无补充', by: '患者录入'
    };
    p.pleural.unshift(rec);
    p.events.push({ d: rec.d, kind: 'procedure', title: `${rec.type} · ${rec.side}`, note: `引流量 ${rec.volume}` });
    render(); toast('已保存一次胸腔操作记录');
    return;
  }
  if (f.id === 'postop-form') {
    p.postop.unshift({
      d: fd.get('date') || today, walk: fd.get('walk') || '未记录', breath: fd.get('breath') || '未记录', src: fd.get('src')
    });
    render(); toast('已保存活动自述（不是肺功能检查）');
    return;
  }
  if (f.id === 'rt-form') {
    const rec = {
      site: fd.get('site') || '未记录', start: fd.get('start') || today,
      plan: (fd.get('plan') || '未记录') + (fd.get('plan') ? ' 次' : ''),
      done: Number(fd.get('done') || 0), status: fd.get('status'),
      note: fd.get('note') || '无补充'
    };
    p.rt.unshift(rec);
    p.events.push({ d: rec.start, kind: 'treatment', title: '放疗记录 · ' + rec.site, note: `计划 ${rec.plan} · 已完成 ${rec.done} 次` });
    render(); toast('已保存放疗记录（计划与实际分开）');
    return;
  }
  if (f.id === 'trial-form') {
    state.trial.q = fd.get('q') || '';
    state.trial.hist = fd.get('hist') || '';
    state.trial.phase = fd.get('phase') || '';
    state.trial.status = fd.get('status') || '';
    state.trial.target = fd.get('target') || '';
    state.trial.region = fd.get('region') || '';
    state.trial.sort = fd.get('sort') || 'start';
    state.trial.ran = true;
    const n = trialFiltered().length;
    render();
    toast(state.trial.channels.local ? `内置登记库命中 ${n} 条` : '内置登记库已关闭，无可用结果');
    return;
  }
  if (f.id === 'nutriq-form') {
    const text = (fd.get('text') || '').trim();
    if (!text) { toast('先写一句问题'); return; }
    p.questionList.push({ id: Date.now(), text, source: '营养支持 · 模拟', selected: true });
    closeModal(); navigate('review'); toast('已加入复诊清单');
    return;
  }
  if (f.id === 'privateq-form') {
    const text = (fd.get('text') || '').trim();
    if (!text) { toast('可以先不写'); return; }
    p.mind.unshift({ d: today, owner: fd.get('owner'), note: text, private: true });
    closeModal(); render(); toast('已私密保存，不进摘要');
    return;
  }
}

function onChange(e) {
  const el = e.target;
  const a = el.dataset ? el.dataset.action : '';
  if (a === 'metric') {
    const k = el.dataset.metric;
    if (el.checked) {
      state.metrics = [...new Set([...state.metrics, k])].slice(-4);
    } else {
      state.metrics = state.metrics.filter((x) => x !== k);
    }
    if ($('#dialog').open) renderMain(); else render();
    return;
  }
  if (a === 'event-filter') {
    state.eventFilter[el.dataset.event] = el.checked;
    render();
    return;
  }
  if (a === 'doc-type') {
    state.docType = el.value;
    render();
    return;
  }
  if (a === 'q-check') {
    const q = current().questionList.find((x) => String(x.id) === el.dataset.id);
    if (q) q.selected = el.checked;
    render();
    return;
  }
  if (a === 'consent-mineru') {
    state.cfg.mineruConsent = el.checked;
    settingsModal('parse');
    return;
  }
  if (a === 'ai-scope') {
    state.cfg.aiScope[el.dataset.key] = el.checked;
    return;
  }
  if (a === 'reduce-motion') {
    state.cfg.reduce = el.checked;
    applyDisplay(); settingsModal('display');
    return;
  }
  if (a === 'nutri-chip') {
    toast(el.checked ? '记下了，去「进食与体重」写一条' : '已取消');
    return;
  }
}

function onInput(e) {
  const el = e.target;
  if (el.dataset && el.dataset.action === 'q-edit') {
    const q = current().questionList.find((x) => String(x.id) === el.dataset.id);
    if (q) q.text = el.value;
    return;
  }
  if (el.id === 'doc-search') {
    state.docFilter = el.value;
    const box = $('#doc-results');
    if (box) box.innerHTML = docTableHtml();
  }
}

function applyDisplay() {
  document.documentElement.dataset.theme = state.cfg.theme;
  document.documentElement.classList.toggle('contrast', state.cfg.contrast === 'high');
  document.documentElement.classList.toggle('reduce-motion', !!state.cfg.reduce);
  document.body.classList.toggle('font-large', state.cfg.font === 'large');
  const tt = $('#theme-toggle');
  tt.textContent = state.cfg.theme === 'dark' ? '浅色' : '深色';
  tt.setAttribute('aria-pressed', String(state.cfg.theme === 'dark'));
  const ft = $('#font-toggle');
  ft.textContent = state.cfg.font === 'large' ? '标准字 Aa' : '大字 Aa';
  ft.setAttribute('aria-pressed', String(state.cfg.font === 'large'));
}

/* ---------- 全局绑定 ---------- */
document.addEventListener('click', onClick);
document.addEventListener('submit', onSubmit);
document.addEventListener('change', onChange);
document.addEventListener('input', onInput);
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-action="point"]')) {
    e.preventDefault();
    pointModal(e.target);
  }
});
$('#dialog').addEventListener('click', (e) => { if (e.target === $('#dialog')) closeModal(); });

/* 调试钩子：便于在浏览器控制台或自动化检查中切换页面 */
window.__lung = { state, render, navigate, setPage(p) { state.page = p; render(); } };

render();
</script>
</body>
</html>
