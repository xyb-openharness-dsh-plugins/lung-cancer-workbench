let current='nsclc', range='6';const contextRecords=[];const entryTemplates={postop:`<h2>记录术后活动自述</h2><p class="hint">可只填一项。自述不是肺功能检查，也不会自动判断恢复是否正常。</p><form class="entry-grid" data-entry="postop"><label>本次日期<input type="date" name="date"></label><label>活动情况<select name="activity"><option value="">请选择（可留空）</option><option>走路/爬楼与之前相近</option><option>比之前更容易停下休息</option><option>活动明显减少</option><option>其他/不确定</option></select></label><label>静息或平卧时的气促变化<select name="breath"><option value="">未记录</option><option>没有注意到变化</option><option>有新变化或加重</option><option>不确定</option></select></label><label>补充说明<textarea name="note" placeholder="可留空"></textarea></label><button class="action primary">保存自述</button></form>`,pleural:`<h2>记录一次胸腔操作</h2><p class="hint">同一天的多次操作分别保存；缺少量或性状也可以先记录。</p><form class="entry-grid" data-entry="pleural"><label>操作日期<input type="date" name="date"></label><label>操作类型<select name="type"><option>诊断性穿刺</option><option>治疗性引流</option><option>置管</option><option>其他/未知</option></select></label><label>侧别/部位原文<input name="site" placeholder="如：左侧；也可留空"></label><label>引流量及单位<input name="amount" placeholder="报告原文，可留空"></label><label>性状原文<input name="character" placeholder="可留空"></label><label>气促自述<textarea name="breath" placeholder="操作前后感受，可留空"></textarea></label><button class="action primary">保存本次操作</button></form>`,immune:`<h2>回顾治疗期间的新变化</h2><p class="hint">只记录自述并与治疗日期并列；这不是完整筛查，不判断 irAE。</p><form class="entry-grid" data-entry="immune"><label>记录日期<input type="date" name="date"></label><fieldset><legend>可选症状（可多选）</legend><label><input type="checkbox" name="symptom" value="咳嗽/气促"> 咳嗽/气促</label><label><input type="checkbox" name="symptom" value="腹泻"> 腹泻</label><label><input type="checkbox" name="symptom" value="皮肤变化"> 皮肤变化</label><label><input type="checkbox" name="symptom" value="发热"> 发热</label><label><input type="checkbox" name="symptom" value="乏力"> 乏力</label></fieldset><label>其他变化<textarea name="other" placeholder="可留空"></textarea></label><button class="action primary">保存自述</button></form>`,blood:`<h2>咯血 / 痰中带血 · 联系入口</h2><div class="notice">本原型没有配置本地审核的联系方式，不提供分级或等待建议。产品上线前必须由本地临床人员核验联系内容；紧急情况请使用所在地正式急救渠道。</div><form class="entry-grid" data-entry="blood"><label>发生时间<input type="datetime-local" name="date"></label><label>看到的情况<textarea name="description" placeholder="例如痰中见血、是否持续（可留空）"></textarea></label><label>伴随感受<textarea name="associated" placeholder="例如呼吸、胸部或头晕感受（可留空）"></textarea></label><button class="action">保存记录</button><button type="button" class="action" id="contact-status">查看联系信息配置状态</button></form><div id="contact-result" class="visually-small" aria-live="polite"></div>`};function renderContext(){const panel=document.querySelector('#context-panel');panel.innerHTML=entryTemplates[current]||'<h2>当前场景</h2><p class="hint">在此整理相关原件、状态和沟通问题。演示数据均为模拟内容。</p>';const list=document.createElement('div');list.className='entry-list';list.id='entry-list';panel.appendChild(list);contextRecords.filter(r=>r.case===current).forEach(r=>{const item=document.createElement('div');item.className='entry-saved';item.textContent=`已保存（仅本次演示） · ${r.summary}`;list.appendChild(item)});const form=panel.querySelector('form[data-entry]');if(form)form.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form);let summary='';if(current==='postop')summary=[fd.get('date'),fd.get('activity'),fd.get('breath'),fd.get('note')].filter(Boolean).join(' · ');if(current==='pleural')summary=[fd.get('date'),fd.get('type'),fd.get('site'),fd.get('amount'),fd.get('character'),fd.get('breath')].filter(Boolean).join(' · ');if(current==='immune')summary=[fd.get('date'),fd.getAll('symptom').join('、'),fd.get('other')].filter(Boolean).join(' · ');if(current==='blood')summary=[fd.get('date'),fd.get('description'),fd.get('associated')].filter(Boolean).join(' · ');contextRecords.push({case:current,summary:summary||'已保存一条未填写详情的记录'});renderContext();});const contact=document.querySelector('#contact-status');if(contact)contact.onclick=()=>{document.querySelector('#contact-result').textContent='状态：未配置。此原型不显示电话号码，不提供未经审核的分级/时限文案。'};}function render(){const d=cases[current];document.querySelector('#point-detail').hidden=true;document.querySelectorAll('.scenario').forEach(b=>{const active=b.dataset.case===current;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelector('#tasks').innerHTML=d.tasks.map(x=>`<article class="task"><span class="tag">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('');renderContext();document.querySelector('.tracks').innerHTML=d.vals.map((v,i)=>`<label class="track"><input type="checkbox" ${i<2?'checked':''} data-track="${v[0]}">${v[0]}</label>`).join('')+'<label class="track"><input type="checkbox" checked data-track="events">治疗/检查事件</label><label class="track"><input type="checkbox" checked data-track="imaging">影像与部位</label>';document.querySelectorAll('[data-track]').forEach(input=>input.onchange=drawChart);document.querySelector('#steps').innerHTML=d.steps.map((x,i)=>`<div class="step"><span class="dot">${i+1}</span><div><b>${x}</b><small>${i===d.steps.length-1?'可补充个人记录':'来源状态可查看'}</small></div></div>`).join('');document.querySelector('#questions').innerHTML=d.q.map(x=>`<div class="question">${x}</div>`).join('');document.querySelector('#events').innerHTML=d.events.map(x=>`<div class="event"><b>${x.split(' · ')[0]}</b><span>${x.split(' · ')[1]}</span></div>`).join('');document.querySelector('#cards').innerHTML=d.vals.map((v,i)=>Number.isFinite(Number(v[1]))?`<button class="flip" aria-pressed="false" aria-label="${v[0]}指标卡，点击左右翻面" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true')"><span class="inner"><span class="face"><span class="hint">${v[0]} · 模拟记录</span><span class="value">${v[1]} <small>${v[2]}</small></span><span class="status">模拟值 · 参考范围未提供　·　点击看趋势 ↻</span></span><span class="face back"><b>${v[0]} · 模拟趋势示意</b><svg viewBox="0 0 260 55" role="img" aria-label="仅用于交互演示的模拟趋势"><polyline points="4,40 55,33 105,37 155,22 205,29 255,12" fill="none" stroke="#17638c" stroke-width="3"/><circle cx="255" cy="12" r="4" fill="#e8873d"/></svg><span class="backhint">示意曲线不来自报告　·　点击回正</span></span></span></button>`:`<article class="task plainmetric"><span class="hint">${v[0]} · 自述/文本记录</span><span class="value">${v[1]}</span><span class="status">${v[2]} · 不绘制数值趋势</span></article>`).join('');document.querySelectorAll('[data-track]').forEach(c=>{c.checked=['CEA','CYFRA21-1','events','imaging'].includes(c.dataset.track)});drawChart()}
function drawChart(){const el=document.querySelector('#chart');const checked=[...document.querySelectorAll('[data-track]:checked')].map(x=>x.dataset.track);const monthsAll=['2025-09','2025-11','2026-01','2026-03','2026-05','2026-07','2026-09'];const count=range==='3'?2:range==='6'?4:range==='12'?6:7;const months=monthsAll.slice(-count);document.querySelector('.xaxis').innerHTML=months.map(x=>`<span>${x}</span>`).join('');const available=cases[current].vals.filter(v=>checked.includes(v[0])&&Number.isFinite(Number(v[1])));el.innerHTML=available.map((v,i)=>{const latest=Number(v[1]);const data=[latest*.76,latest*.91,latest*.88,latest*1.12,latest*1.04,latest*.97,latest];const vals=data.slice(-count);const low=Math.min(...vals),high=Math.max(...vals),span=Math.max(high-low,Math.abs(high)*.12,1);const coords=vals.map((value,j)=>({x:8+j*(584/Math.max(1,vals.length-1)),y:78-((value-low)/span)*64,value}));const pts=coords.map(p=>`${p.x},${p.y}`).join(' ');const color=['#17638c','#e8873d','#4d9a7e'][i%3];const dots=coords.map((p,j)=>`<circle class="metric-point" tabindex="0" role="button" aria-label="${v[0]} ${months[j]} 模拟值 ${p.value.toFixed(1)} ${v[2]}，查看详情" data-point="${v[0]}|${months[j]}|${p.value.toFixed(1)}|${v[2]}" cx="${p.x}" cy="${p.y}" r="5"/>`).join('');return `<div class="metric-row"><div class="metric-name">${v[0]}<small>${v[2]} · 独立刻度</small></div><svg class="spark" viewBox="0 0 600 88" preserveAspectRatio="none" role="img" aria-label="${v[0]}模拟趋势，${months.length}个模拟日期，纵轴独立"><text x="2" y="12" fill="#657d8b" font-size="10">${high.toFixed(1)}</text><text x="2" y="84" fill="#657d8b" font-size="10">${low.toFixed(1)}</text><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3"/><g fill="white" stroke="${color}" stroke-width="3">${dots}</g></svg></div>`}).join('')||'<div class="hint">当前没有可绘制的数值记录；事件时间轴仍可查看。文本型/未记录指标不转换成数值。</div>';const ev=document.querySelector('.events');const imaging=checked.includes('imaging'),treatments=checked.includes('events');const monthCut=range==='3'?'2026-07':range==='6'?'2026-04':range==='12'?'2025-10':'0000-00';[...ev.children].forEach(x=>{const isImage=/CT|MRI|影像|超声|PET|X线/.test(x.innerText);const eventMonth=x.dataset.month||'';const inRange=!/^\d{4}-\d{2}$/.test(eventMonth)||eventMonth>=monthCut;x.hidden=!(inRange&&(isImage?imaging:treatments))});ev.style.display=(imaging||treatments)?'flex':'none';document.querySelector('.xaxis').style.display=available.length?'flex':'none';document.querySelectorAll('.metric-point').forEach(point=>{const show=()=>{const [metric,date,value,unit]=point.dataset.point;const detail=document.querySelector('#point-detail');detail.hidden=false;detail.textContent=`${metric} · ${date} · 模拟值 ${value} ${unit} · 模拟报告来源（不是真实记录）`;};point.onclick=show;point.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}}})}document.querySelectorAll('.scenario').forEach(b=>b.onclick=()=>{current=b.dataset.case;render()});document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;document.querySelectorAll('[data-range]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b))});drawChart()});document.querySelectorAll('[data-track]').forEach(b=>b.onchange=drawChart);document.querySelector('.action.primary').onclick=()=>{document.querySelector('#questions').scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('#my-question')?.focus()};document.querySelectorAll('.action').forEach(b=>{if(b.textContent.includes('查看来源状态'))b.onclick=()=>{document.querySelector('#questions').insertAdjacentHTML('beforeend','<div class=\"question\">演示状态：当前场景未附加真实来源文件；此页面不伪造原件链接。</div>')}});const qform=document.querySelector('#question-form');qform?.addEventListener('submit',e=>{e.preventDefault();const input=qform.elements.question;const value=input.value.trim();if(!value)return;const item=document.createElement('div');item.className='question';item.textContent=value;document.querySelector('#questions').appendChild(item);input.value=''});const navTargets=['top','tasks','onepage','context-panel','questions'];document.querySelector('.top').id='top';document.querySelector('.taskgrid').id='tasks';document.querySelector('.layout > div > .panel').id='onepage';document.querySelectorAll('.nav button').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(navTargets[i]).scrollIntoView({behavior:'smooth',block:'start'})});render();
</script></body></html>
